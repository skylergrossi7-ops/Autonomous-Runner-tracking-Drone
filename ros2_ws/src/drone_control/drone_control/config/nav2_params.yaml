local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.08
      robot_radius: 0.45
      track_unknown_space: false
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: true
        # Include slightly below-ground AI-depth noise and obstacles above the
        # two-metre flight height in the same rolling voxel column.
        origin_z: -1.0
        z_resolution: 0.35
        z_voxels: 16
        min_obstacle_height: 0.25
        max_obstacle_height: 4.5
        unknown_threshold: 15
        mark_threshold: 1
        combination_method: 1
        observation_sources: depth_ai_environment
        depth_ai_environment:
          topic: /camera/depth_ai/filtered_points
          data_type: "PointCloud2"
          transport_type: "raw"
          sensor_frame: ""
          clearing: true
          marking: true
          # The optimized CPU pipeline publishes near 4 Hz. Short persistence
          # prevents a moving runner's pre-mask points becoming a six-second
          # phantom obstacle in the center corridor.
          observation_persistence: 2.0
          expected_update_rate: 0.25
          min_obstacle_height: 0.25
          max_obstacle_height: 4.5
          raytrace_min_range: 0.30
          raytrace_max_range: 15.0
          obstacle_min_range: 0.30
          obstacle_max_range: 15.0
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0
        # Must remain at least the 0.45 m configured vehicle radius.
        inflation_radius: 0.46

      always_send_full_costmap: true
